<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — UXPLORES</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="admin-body">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">UXPLORES<span class="dot">.</span></div>
      <p class="login-sub">Admin Dashboard</p>

      {% if error %}
      <div class="login-error">{{ error }}</div>
      {% endif %}

      <form method="POST" action="{{ url_for('admin_login') }}">
        <div class="login-field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter admin password" required autofocus>
        </div>
        <button type="submit" class="login-btn">Log In</button>
      </form>

      <a href="{{ url_for('home') }}" class="login-back">&larr; Back to site</a>
    </div>
  </div>
</body>
</html>
