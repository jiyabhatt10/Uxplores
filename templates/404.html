{% extends "base.html" %}
{% import "_icons.html" as ic %}

{% block title %}Page Not Found — UXPLORES{% endblock %}

{% block content %}
<div class="notfound-wrap">
  <div class="reveal-scale in-view">
    <div class="notfound-code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <a href="{{ url_for('home') }}" class="btn btn-gradient btn-lg">
      Back to Home
      <span class="icon-move-right" style="display:flex;">{{ ic.icon('arrow-right', 20) }}</span>
    </a>
  </div>
</div>
{% endblock %}
